    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#31102f" stroke-width="0.7" stroke-opacity="0.38"/>
    </pattern>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Chassis -->
  <rect width="900" height="240" rx="14" fill="url(#bgGrad)"/>
  <rect width="900" height="240" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="238" rx="13" fill="none" stroke="#4c1d95" stroke-width="1.2"/>

  <!-- Glowing Ambiance Orbs -->
  <circle cx="115" cy="120" r="82" fill="#f43f5e" opacity="0.12" filter="blur(42px)"/>
  <circle cx="780" cy="125" r="88" fill="#f59e0b" opacity="0.11" filter="blur(45px)"/>

  <!-- Left Ghidra Disassembler & PE Header Schematic -->
  <g transform="translate(52, 46)">
