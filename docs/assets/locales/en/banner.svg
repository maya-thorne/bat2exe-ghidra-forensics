    <rect x="0" y="0" width="136" height="24" rx="10" fill="#271026"/>
    <circle cx="14" cy="12" r="3.5" fill="#fb7185"/>
    <circle cx="26" cy="12" r="3.5" fill="#f59e0b"/>
    <circle cx="38" cy="12" r="3.5" fill="#38bdf8"/>
    <text x="52" y="15.5" fill="#fda4af" font-family="Consolas, monospace" font-size="9" font-weight="700">PE32 / GHIDRA</text>

    <!-- Disassembly Lines -->
    <text x="10" y="44" fill="#fb7185" font-family="Consolas, monospace" font-size="9.5" font-weight="700">0x20ea0: PUSHAD</text>
    <text x="10" y="61" fill="#f59e0b" font-family="Consolas, monospace" font-size="9.5">0x20ea1: MOV ESI,..</text>
    <text x="10" y="78" fill="#38bdf8" font-family="Consolas, monospace" font-size="9.5">0x0337e: JMP CorExe</text>
    <text x="10" y="95" fill="#c084fc" font-family="Consolas, monospace" font-size="9.5">0x01670: ThunRTMain</text>
    <text x="10" y="112" fill="#34d399" font-family="Consolas, monospace" font-size="9.5">0x116B0: DetourHook</text>

    <!-- Progress Bar -->
