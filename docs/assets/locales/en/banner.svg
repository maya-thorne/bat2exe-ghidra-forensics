      <text x="224" y="15.5" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">UPX · .NET CLR · VB6 RE</text>

      <rect x="400" y="0" width="215" height="24" rx="6" fill="#0c1e33" stroke="#0369a1" stroke-width="1"/>
      <circle cx="412" cy="12" r="3" fill="#38bdf8" filter="url(#neon-glow)"/>
      <text x="422" y="15.5" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">8 CORE SOURCE TEARDOWNS</text>
