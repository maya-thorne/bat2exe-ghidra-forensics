    <rect x="10" y="125" width="98" height="8" rx="4" fill="url(#titleGrad)" filter="url(#neon-glow)"/>
  </g>

  <!-- Content Group -->
  <g transform="translate(218, 42)">
    <!-- Top System Badges -->
    <g>
      <rect x="0" y="0" width="192" height="24" rx="6" fill="#2a0a18" stroke="#9f1239" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#fb7185" filter="url(#neon-glow)"/>
      <text x="22" y="15.5" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">GHIDRA MCP PE FORENSICS</text>

